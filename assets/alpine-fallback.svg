<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120e1a"/>
      <stop offset="45%" stop-color="#0b0a10"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3c2f58" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#171224" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#60478d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#241b37" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="violetAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2e2544" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Radar Circles -->
  <circle cx="600" cy="337" r="280" fill="none" stroke="#4c376e" stroke-width="1" stroke-dasharray="4 6" opacity="0.35"/>
  <circle cx="600" cy="337" r="180" fill="none" stroke="#4c376e" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="600" cy="337" r="80" fill="none" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Tactical Reticle Axis -->
  <line x1="600" y1="40" x2="600" y2="635" stroke="#4c376e" stroke-width="1" stroke-dasharray="3 7" opacity="0.3"/>
  <line x1="80" y1="337" x2="1120" y2="337" stroke="#4c376e" stroke-width="1" stroke-dasharray="3 7" opacity="0.3"/>

  <!-- Stylized Mountain Peaks -->
  <polygon points="120,540 380,260 620,540" fill="url(#mountain1)"/>
  <polygon points="760,540 960,310 1140,540" fill="url(#mountain1)"/>
  <polygon points="340,540 600,190 860,540" fill="url(#mountain2)"/>

  <!-- Peak Highlight Lines -->
  <line x1="600" y1="190" x2="520" y2="540" stroke="#c084fc" stroke-width="2" opacity="0.6"/>
  <line x1="380" y1="260" x2="330" y2="540" stroke="#a855f7" stroke-width="1.5" opacity="0.5"/>
  <line x1="960" y1="310" x2="990" y2="540" stroke="#a855f7" stroke-width="1.5" opacity="0.5"/>

  <!-- Terrain Elevation Contours -->
  <path d="M 180 500 Q 600 440 1020 500" fill="none" stroke="#60478d" stroke-width="1" stroke-dasharray="2 4" opacity="0.4"/>
  <path d="M 260 460 Q 600 400 940 460" fill="none" stroke="#60478d" stroke-width="1" stroke-dasharray="2 4" opacity="0.4"/>

  <!-- Telemetry Overlay Badge -->
  <rect x="440" y="100" width="320" height="32" rx="4" fill="#130e1c" stroke="#a855f7" stroke-width="1" stroke-opacity="0.8"/>
  <text x="600" y="121" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">SECTOR 04 · ALPINE TERRAIN</text>

  <!-- Coordinates & Status -->
  <text x="600" y="580" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="4" text-anchor="middle">LAT 64° 08' N · LON 21° 56' W · ELEVATION 2,480M</text>
  <rect x="490" y="605" width="220" height="24" rx="2" fill="#1e152e" stroke="#7c3aed" stroke-width="0.75" opacity="0.9"/>
  <text x="600" y="621" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="2.5" text-anchor="middle">OFFICIAL ARTWORK PENDING</text>
</svg>
